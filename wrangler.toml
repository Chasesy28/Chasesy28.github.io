name = "silly-site-worker"
main = "workers/index.js"
compatibility_date = "2024-12-19"

# Account details (added from user)
account_id = "d82a8a8eb7c815f16d6fcb5a58f12fd3"

# Workers Site Configuration
[site]
bucket = "./"
# Exclude files that shouldn't be uploaded to Cloudflare Workers
exclude = [
  ".git/**",
  ".github/**",
  "node_modules/**",
  "workers/**",
  "tools/**",
  ".vscode/**",
  "README.md",
  "SECURITY.md",
  "LICENSE",
  "package.json",
  "package-lock.json",
  "wrangler.toml",
  ".gitignore"
]

# Environment Variables
[env.production]
name = "silly-site-worker-prod"

[env.staging]
name = "silly-site-worker-staging"

# Route Configuration for your domain (use array of inline tables)
# Bind Worker to your domains so it serves the uploaded site assets and applies headers/caching.
routes = [ { pattern = "silly-site.me/*", zone_id = "73fbb56d9b1a45c74519f9abec41fd84" }, { pattern = "www.silly-site.me/*", zone_id = "73fbb56d9b1a45c74519f9abec41fd84" } ]

# KV Namespace Bindings (for caching and storage)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"

# R2 Bucket Bindings (for image storage)
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "silly-site-images"
