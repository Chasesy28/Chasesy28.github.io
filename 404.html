<!DOCTYPE html>
<html class="light" lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
                   initial-scale=1.0">
    <title>
      Silly Page not found
    </title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/notification-bars.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/icon-192x192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">
  </head>

  <body>
    <header id="header">
      <div class="site-title cherry-bomb-one-regular">
        <a href="/">Silly Site</a>
      </div>
      <nav>
        <ul class="cherry-bomb-one-regular">
          <li><a href="/">Home</a></li>
          <li><a href="/#about-me">About Me</a></li>
          <li><a href="/#projects">Projects</a></li>
          <li><a href="https://github.com/Chasesy28/Chasesy28.github.io" target="_blank"
              rel="noopener noreferrer">GitHub</a></li>
          <li>
            <button id="darkModeToggle" class="dark-mode-toggle" aria-label="Toggle dark mode">
              <span class="sun-icon">☀️</span>
              <span class="moon-icon" style="display: none;">🌙</span>
            </button>
          </li>
        </ul>
      </nav>
    </header>
    <div class="rain">
      <div class="ground"></div>
    </div>
    <div class="cherry-bomb-one-regular">
      <h1> 404 </h1>
      <p>
        I cant find the page you are looking for...
      </p>
      <a href="./index.html">
        Go Back to Home
      </a>
    </div>
    <script>
      /**
       * DARK MODE TOGGLE FUNCTIONALITY FOR 404 PAGE
       * Syncs with theme stored in localStorage from home page
       */
      const darkModeToggle = document.getElementById('darkModeToggle');
      const html = document.documentElement;
      const sunIcon = document.querySelector('.sun-icon');
      const moonIcon = document.querySelector('.moon-icon');

      // Load saved theme or default to light
      const currentTheme = localStorage.getItem('theme') || 'light';
      html.classList.remove('light', 'dark');
      html.classList.add(currentTheme);
      updateIcons(currentTheme);
      console.log('[404] Theme loaded:', currentTheme);

      // Toggle theme on button click
      darkModeToggle.addEventListener('click', function () {
        if (html.classList.contains('dark')) {
          html.classList.replace('dark', 'light');
          localStorage.setItem('theme', 'light');
          updateIcons('light');
          console.log('[404] Theme switched to: LIGHT');
        } else {
          html.classList.replace('light', 'dark');
          localStorage.setItem('theme', 'dark');
          updateIcons('dark');
          console.log('[404] Theme switched to: DARK');
        }
      });

      /**
       * Updates the theme toggle icon based on current theme
       * @param {string} theme - Either 'light' or 'dark'
       */
      function updateIcons(theme) {
        if (theme === 'dark') {
          sunIcon.style.display = 'none';
          moonIcon.style.display = 'inline';
        } else {
          sunIcon.style.display = 'inline';
          moonIcon.style.display = 'none';
        }
      }
    </script>
    <!-- Site-wide announcements system -->
    <script src="/announcements.js"></script>
    <script src="/notification-bars.js"></script>
    <script>
      // Initialize announcements when page loads
      window.Announcements.initialize();
    </script>
  </body>

</html>
