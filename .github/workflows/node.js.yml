name: CI and Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - name: Build application
        if: matrix.node-version == '22.x'
        run: npm run build
      - run: npm test

  build-pages-artifact:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Include static legacy assets
        run: |
          set -e
          mkdir -p dist
          for dir in projects icons images; do
            if [ -d "$dir" ]; then
              cp -R "$dir" dist/
            fi
          done
          for file in 404.html CNAME manifest.json sw.js styles.css tailwind.css assets/notification/notification-bars.css assets/notification/notification-bars.js scripts.js admin-auth.js announcements.js; do
            if [ -f "$file" ]; then
              cp "$file" dist/
            fi
          done
      - name: Inject Supabase config into legacy admin panel
        env:
          SITE_ORIGIN: https://silly-site.me
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          PANEL_FILE="dist/projects/Admin/Panel.html"
          ADMIN_FILE="dist/projects/Admin/admin.html"
          CHAT_FILE="dist/projects/Admin/chat.html"

          if [ ! -f "$PANEL_FILE" ] && [ ! -f "$ADMIN_FILE" ] && [ ! -f "$CHAT_FILE" ]; then
            echo "Admin panel files not found; skipping Supabase injection."
            exit 0
          fi

          if [ -z "$SUPABASE_URL" ] || { [ -z "$SUPABASE_PUBLISHABLE_KEY" ] && [ -z "$SUPABASE_ANON_KEY" ]; }; then
            echo "Supabase secrets are missing; leaving panel in local-config mode."
            exit 0
          fi

          node - <<'NODE'
          const fs = require('fs');
          const panelFiles = [
            'dist/projects/Admin/Panel.html',
            'dist/projects/Admin/admin.html',
            'dist/projects/Admin/chat.html',
          ];
          const siteOrigin = process.env.SITE_ORIGIN || 'https://silly-site.me';
          const supabaseUrl = process.env.SUPABASE_URL || '';
          const publishableKey = process.env.SUPABASE_PUBLISHABLE_KEY || '';
          const anonKey = process.env.SUPABASE_ANON_KEY || '';

          for (const panelFile of panelFiles) {
            if (!fs.existsSync(panelFile)) continue;

            let html = fs.readFileSync(panelFile, 'utf8');
            html = html.replaceAll('__SITE_ORIGIN__', siteOrigin);
            html = html.replaceAll('__SUPABASE_URL__', supabaseUrl);
            html = html.replaceAll('__SUPABASE_PUBLISHABLE_KEY__', publishableKey || anonKey);
            html = html.replaceAll('__SUPABASE_ANON_KEY__', anonKey || publishableKey);
            fs.writeFileSync(panelFile, html);
          }
          NODE
      - name: Create /vite directory for GitHub Pages clean-URL routing
        run: |
          set -e
          mkdir -p dist/vite
          cp dist/vite.html dist/vite/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-pages-artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
