      body {

        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f2f5;
      }

      #open-popup-btn {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>

      window.addEventListener('message', (event) => {

        if (event.data === 'spawnNewWindow') {
          openPopup();
        }
      });

</html>
