<!doctype html>
<html>

<head>
  <title>Test</title>
  <link rel="icon" href="../icons/icon-192x192.png">
  <link rel="stylesheet" href="../styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">

</head>

<body>
  <div class="rain">
    <button onclick="history.back()">Back</button>
    <p>Hello <br> Hello, this thing here is useful.</p>
    <input type="range" min="1" max="30" step="0.1" id="input" value="15">
    <p id="test">15</p>
  </div>
  <div class="ground"></div>
  <script>
    /**
     * RAIN ANIMATION TEST PAGE
     * Simplified version of rain animation with adjustable density control
     * Allows testing different drop densities via slider input
     */
    
    const rainContainer = document.querySelector('.rain');
    let dropDensity = 15; // Controls number of drops (pixels per drop)
    
    /**
     * Creates a single raindrop element with random properties
     * Similar to main scripts.js but without slide collision detection
     */
    const createDrop = () => {
      const drop = document.createElement('div');
      drop.classList.add('drop');

      // Randomize drop appearance
      drop.style.left = `${Math.random() * 100}vw`;           // Random horizontal position
      drop.style.animationDelay = `${Math.random() * 2}s`;    // Stagger start times
      drop.style.animationDuration = `${0.7 + Math.random() * 0.5}s`; // Vary fall speed

      /**
       * Create ground splash effect on each animation iteration
       * Triggered when drop completes one fall cycle
       */
      drop.addEventListener('animationiteration', () => {
        const splash = document.createElement('div');
        splash.classList.add('splash');
        splash.style.left = drop.style.left;
        splash.style.bottom = '5px';
        rainContainer.appendChild(splash);

        // Trigger CSS animation after brief delay
        setTimeout(() => {
          splash.classList.add('splash-animation');
        }, 10);

        // Remove splash element when animation completes
        splash.addEventListener('animationend', () => {
          splash.remove();
        }, { once: true });
      });

      rainContainer.appendChild(drop);
    };

    /**
     * Adjusts number of raindrops based on screen width and density setting
     * Maintains consistent visual density across different viewport sizes
     */
    const handleResize = () => {
      const newNumberOfDrops = Math.floor(window.innerWidth / dropDensity);
      const currentDrops = rainContainer.querySelectorAll('.drop');
      const diff = newNumberOfDrops - currentDrops.length;

      if (diff > 0) {
        // Add more drops if screen grew
        for (let i = 0; i < diff; i++) {
          createDrop();
        }
      } else if (diff < 0) {
        // Remove excess drops if screen shrunk
        for (let i = 0; i < Math.abs(diff); i++) {
          // Remove from end to minimize visual disruption
          if (currentDrops[currentDrops.length - 1 - i]) {
            currentDrops[currentDrops.length - 1 - i].remove();
          }
        }
      }
    };

    /**
     * Initializes rain animation with initial set of drops
     */
    const initRain = () => {
      const initialNumberOfDrops = Math.floor(window.innerWidth / dropDensity);
      console.log('[Test Page] Initializing rain with', initialNumberOfDrops, 'drops');
      for (let i = 0; i < initialNumberOfDrops; i++) {
        createDrop();
      }
    };
    
    // Wait for DOM to be ready before initializing
    document.addEventListener('DOMContentLoaded', function () {
      initRain();
      window.addEventListener('resize', handleResize);
    });
    
    /**
     * DENSITY CONTROL SLIDER
     * Allows real-time adjustment of drop density for testing
     */
    const input = document.getElementById("input");
    const testText = document.getElementById("test");
    
    input.addEventListener("input", function () {
      dropDensity = input.value;
      testText.textContent = String(dropDensity);
      console.log('[Test Page] Drop density changed to:', dropDensity);
      handleResize(); // Recalculate drop count with new density
    });
  </script>
</body>

</html>
