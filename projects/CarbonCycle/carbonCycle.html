<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Carbon Cycle Poster</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="poster">
      <h1>Carbon Cycle</h1>
      <div id="lithosphere" class="sphere">
        <h2>Lithosphere</h2>
        <img src="lithosphere.png">
      </div>
      <div id="atmosphere" class="sphere">
        <h2>Atmosphere</h2>
      </div>
      <div id="hydrosphere" class="sphere">
        <h2>Hydrosphere</h2>
      </div>
      <div id="biosphere" class="sphere">
        <h2>Biosphere</h2>
      </div>
      <div id="wildfireContainer" class="processContainer">
        <h3 id="wildfireText">Wildfires</h3>
        <img class="arrow" id="wildfireArrow" src="arrow.png" alt="Wildfire Arrow" width="150" height="150">
        <div id="wildfireInfo" class="info">
          <p>Wildfires release carbon dioxide into the atmosphere, contributing to climate change.</p>
        </div>
      </div>
    </div>
    <script src="scripts.js"></script>
  </body>
</html>
