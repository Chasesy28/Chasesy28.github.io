<!DOCTYPE html>
<html class="light" lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-status-bar-style" content="default">
    <title>
      Silly Page not found
    </title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/assets/notification/notification-bars.css">
    <link rel="stylesheet" href="/legal/cookie-consent.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/icon-192x192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">
  </head>

  <body>
    <!-- full‑screen loader shown until page fully loaded -->
    <div id="loading-screen" aria-live="polite" role="status" aria-label="Loading" aria-hidden="true">
      <div class="loader">
        <span class="loader-icon" aria-hidden="true">🔄</span>
        <div class="loader-bar" aria-hidden="true">
          <div class="loader-progress"></div>
        </div>
      </div>
    </div>
    <!-- accessibility settings trigger and panel -->
    <button id="accessibility-toggle" aria-label="Accessibility settings" aria-controls="accessibility-settings"
      aria-expanded="false" class="accessibility-button">⚙️</button>
    <div id="accessibility-settings" class="hidden" role="dialog" aria-modal="true"
      aria-labelledby="accessibility-title" aria-hidden="true" tabindex="-1">
      <h2 id="accessibility-title">Accessibility</h2>
      <button id="close-accessibility" class="accessibility-close-btn" aria-label="Close accessibility settings">×</button>
      <div class="accessibility-actions">
        <button id="increase-font">Increase Font</button>
        <button id="decrease-font">Decrease Font</button>
        <button id="toggle-contrast">High contrast</button>
        <button id="toggle-reduced-motion">Reduce motion</button>
        <button id="toggle-font-style">Disable custom font</button>
      </div>
    </div>
    <header id="header">
      <div class="site-title cherry-bomb-one-regular">
        <a href="/">Silly Site</a>
      </div>
      <nav aria-label="Primary">
        <ul class="cherry-bomb-one-regular">
          <li><a href="/">Home</a></li>
          <li><a href="/#about-me">About Me</a></li>
          <li><a href="/#projects">Projects</a></li>
          <li><a href="https://github.com/Chasesy28/Chasesy28.github.io" target="_blank"
              rel="noopener noreferrer">GitHub</a></li>
          <li>
            <button id="darkModeToggle" class="dark-mode-toggle" aria-label="Toggle dark mode">
              <span class="sun-icon">☀️</span>
              <span class="moon-icon" style="display: none;">🌙</span>
            </button>
          </li>
        </ul>
      </nav>
    </header>
    <div class="rain" aria-hidden="true">
      <div class="ground"></div>
    </div>
    <div class="cherry-bomb-one-regular">
      <h1> 404 </h1>
      <p>
        I cant find the page you are looking for...
      </p>
      <a href="https://www.silly-site.me/index.html">
        Go Back to Home ->
      </a>
      <p>
        <a href="/legal/privacy-policy.html">Privacy Policy</a>
        ·
        <a href="/legal/terms-of-service.html">Terms of Service</a>
      </p>
    </div>
    <!-- Core utilities (rain, loader, accessibility, theme) -->
    <script src="/scripts.js"></script>
    <!-- Site-wide announcements system -->
    <script src="/announcements.js"></script>
    <script src="/assets/notification/notification-bars.js"></script>
    <script src="/legal/cookie-consent.js"></script>
    <script>
      // Initialize announcements when page loads
      window.Announcements.initialize();
    </script>
  </body>

</html>
