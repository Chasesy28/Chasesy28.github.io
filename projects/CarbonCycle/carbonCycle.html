<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Carbon Cycle Poster</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="poster">
      <h1>Carbon Cycle</h1>
      <div id="lithosphere" class="sphere">
        <h2>Lithosphere</h2>
      </div>
      <div id="atmosphere" class="sphere">
        <h2>Atmosphere</h2>
      </div>
      <div id="hydrosphere" class="sphere">
        <h2>Hydrosphere</h2>
      </div>
      <div id="biosphere" class="sphere">
        <h2>Biosphere</h2>
        <div id="wildfires">
          <h3>Wildfires</h3>
          <img src="wildfire.png" alt="Wildfire" width="100">
        </div>
      </div>
    </div>
    <script src="scripts.js"></script>
  </body>
</html>
