<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AP Project Tam High 2026-Chase and Benjamin</title>
    <!--link to the CSS file-->
    <link rel="stylesheet" href="/projects/ApProject/apProject.css">
    <!--Use shared site manifest so all app metadata is centralized in one file.-->
    <link rel="manifest" href="/manifest.json">
  </head>

  <body>
      <canvas id="gameArea">Game Area</canvas>
      <h1 id="gameTitle" class="gameTitles">AP Project</h1>
      <button id="playButton" class="play-overlay" onclick="startGame()">▶</button>
      <button id="fullscreenButton" class="fs-button" onclick="toggleFullScreen()">⛶</button>
      <button id="settingsButton" class="settings-button" onclick="toggleSettings()">⚙️</button>
      <div id="settingsMenu" class="hidden settings-menu">
        <h2>Settings</h2>
        <label for="jump">Jump Keybind:</label>
        <button id="jump"></button>
        <label for="left">Left Keybind:</label>
        <button id="left"></button>
        <label for="right">Right Keybind:</label>
        <button id="right"></button>
        <label for="interact">Interact Keybind:</label>
        <button id="interact"></button>
        <label for="previousLevel">Previous Level Keybind:</label>
        <button id="previousLevel"></button>
        <label for="nextLevel">Next Level Keybind:</label>
        <button id="nextLevel"></button>
        <label for="previousLayer">Previous Layer Keybind:</label>
        <button id="previousLayer"></button>
        <label for="nextLayer">Next Layer Keybind:</label>
        <button id="nextLayer"></button>
        <label for="respawn">Respawn Keybind:</label>
        <button id="respawn"></button>
      </div>
      <script src="apProjectSettings.js"></script>
      <script src="apProjectLevelData.js"></script>
      <script src="apProjectLevelObjects.js"></script>
      <script src="apProjectLevelBuild.js"></script>
      <script src="apProject.js"></script>
  </body>

</html>
