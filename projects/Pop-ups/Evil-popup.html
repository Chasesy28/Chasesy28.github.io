<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-In</title>
    <style>
        /* Styles for the main page */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        #open-popup-btn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: white;
            border: solid;
            color: black;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            margin: 4px 2px;
            transition-duration: 0.4s;
        }
    </style>
</head>
<body>

    <button id="open-popup-btn">Sign In</button>

    <script>
        // Get the button element
        const openPopupBtn = document.getElementById('open-popup-btn');

        // --- 1. ADD THIS LISTENER (THE "MAILBOX") ---
        // This listens for messages from any window
        window.addEventListener('message', (event) => {
            // If the message is the one we expect, run the function
            if (event.data === 'spawnNewWindow') {
                openSignInPopup();
            }
        });

        // Function to open the sign-in popup
        const openSignInPopup = () => {

            // --- 1. Define window features ---
            const width = 450;
            const height = 350;

            let x = (screen.width / 2) - (width / 2);
            let y = (screen.height / 2) - (height / 2);

            let dx = 2; // Horizontal speed (pixels per frame)
            let dy = 2; // Vertical speed (pixels per frame)

            const windowFeatures = `width=${width},height=${height},left=${x},top=${y},popup=yes`;

            // --- 2. Open the new window ---
            const popupWindow = window.open('', 'signInPopup', windowFeatures);

            if (!popupWindow) {
                alert('Popup blocked! Please allow popups for this site to sign in.');
                return;
            }

            // --- 3. Define the HTML and CSS content for the popup ---
            const popupHTML = `
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <title>You are an IDIOT</title>
                    <style>
                        html, body {
                            height: 100%;
                            margin: 0;
                            padding: 0;
                            overflow: hidden;
                        }
                        .gif-background {
                            background-image: url('https://upload.wikimedia.org/wikipedia/commons/5/5c/You_Are_An_Idiot_screen.gif');
                            background-repeat: no-repeat;
                            background-size: cover;
                            background-attachment: fixed;
                            background-position: center center;
                            height: 100%;
                        }
                    </style>
                </head>
                <body class="gif-background">
                    <script>
                        window.addEventListener('load', () => {
                            function playAudioFromLink() {
                                const audioUrl = 'https://cdn.pixabay.com/download/audio/2023/06/19/audio_95a3f0ae2f.mp3?filename=laugh-high-pitch-154516.mp3';
                                const audio = new Audio(audioUrl);
                                audio.loop = true;
                                audio.play().catch(e => console.error('Audio failed:', e));
                            }

                            document.body.addEventListener('click', () => {
                                playAudioFromLink();

                                if (window.opener && !window.opener.closed) {

                                    // --- 2. THIS IS THE MODIFIED LINE ---
                                    // Send a message instead of calling the function
                                    window.opener.postMessage('spawnNewWindow', '*');
                                }
                            });
                        });
                    <\/script>
                    </body>
                </html>
            `;

            // --- 4. Write the HTML to the new window ---
            popupWindow.document.write(popupHTML);
            popupWindow.document.close();
            popupWindow.focus();

            // --- 5. Animation Loop ---
            const movePopup = () => {
                if (popupWindow.closed) {
                    clearInterval(animationInterval);
                    return;
                }

                x += dx;
                y += dy;

                //if (x + width >= screen.availWidth || x <= 0) { dx = -dx; }
                //if (y + height >= screen.availHeight || y <= 0) { dy = -dy; }

                //x = Math.max(0, Math.min(x, screen.availWidth - width));
                //y = Math.max(0, Math.min(y, screen.availHeight - height));

                try {
                    //popupWindow.moveTo(x, y);
                    popupWindow.moveBy(dx, dy);
                    popupWindow.focus();
                } catch (e) {
                    // Browser might block this
                }
            };

            const animationInterval = setInterval(movePopup, 16);
        };

        // Event listener to open the popup when the button is clicked
        openPopupBtn.addEventListener('click', openSignInPopup);
    </script>
</body>
</html>
