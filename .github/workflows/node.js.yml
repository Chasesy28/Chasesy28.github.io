name: CI and Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test

  build-pages-artifact:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Include static legacy assets
        run: |
          set -e
          mkdir -p dist
          for dir in projects icons images; do
            if [ -d "$dir" ]; then
              cp -R "$dir" dist/
            fi
          done
          for file in 404.html CNAME manifest.json sw.js styles.css notification-bars.css notification-bars.js scripts.js admin-auth.js announcements.js; do
            if [ -f "$file" ]; then
              cp "$file" dist/
            fi
          done
      - name: Create /vite directory for GitHub Pages clean-URL routing
        run: |
          set -e
          mkdir -p dist/vite
          cp dist/vite.html dist/vite/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-pages-artifact
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
